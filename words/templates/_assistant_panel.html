<style>
  /* 小助手浮动按钮与面板移动端专属适配 */
  @media (max-width: 768px) {
    .assistant-fab {
      bottom: calc(76px + env(safe-area-inset-bottom, 0px)) !important;
      right: 14px !important;
      width: 48px !important;
      height: 48px !important;
      padding: 0 !important;
      justify-content: center !important;
      border-radius: 50% !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22) !important;
      z-index: 90 !important;
    }
    .assistant-fab span { display: none !important; }
    .assistant-panel {
      bottom: calc(68px + env(safe-area-inset-bottom, 0px)) !important;
      right: 10px !important;
      left: 10px !important;
      width: auto !important;
      max-width: none !important;
      height: auto !important;
      max-height: 72vh !important;
      border-radius: 16px !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28) !important;
      z-index: 95 !important;
    }
    .assistant-input-row {
      padding: 8px 10px !important;
      gap: 6px !important;
    }
    .assistant-input-row textarea {
      font-size: 16px !important;
      padding: 8px 12px !important;
      border-radius: 16px !important;
      min-height: 38px !important;
      max-height: 100px !important;
      resize: none !important;
    }
    .assistant-input-row button {
      width: 38px !important;
      height: 38px !important;
      border-radius: 50% !important;
      padding: 0 !important;
      display: grid !important;
      place-items: center !important;
      flex: none !important;
    }
  }
</style>

<!-- 小助手聊天面板（背诵/复习共用，对话历史互通） -->
<div id="assistantPanel" class="assistant-panel hidden">
  <div class="assistant-header">
    <div class="assistant-header-title">
      <i class="ph ph-chat-circle-text" style="color: var(--c-green);"></i> 小助手
    </div>
    <div style="display: flex; gap: 4px;">
      <button class="btn btn-ghost btn-sm" onclick="AssistantPanel.clearHistory()" title="清空对话记录"><i class="ph ph-trash"></i></button>
      <button class="btn btn-ghost btn-sm" onclick="AssistantPanel.close()" title="收起 (ESC)"><i class="ph ph-x"></i></button>
    </div>
  </div>
  <div id="assistantBody" class="assistant-body">
    <div class="assistant-empty">加载对话记录…</div>
  </div>
  <div class="assistant-actions">
    <button id="assistantAskWordBtn" class="btn btn-secondary btn-sm" onclick="AssistantPanel.askCurrentWord()"><i class="ph ph-lightbulb"></i> 问当前单词考法</button>
  </div>
  <div class="assistant-input-row">
    <textarea id="assistantInput" class="form-input" rows="1" placeholder="随便问点什么…（Enter 发送）"></textarea>
    <button id="assistantSendBtn" class="btn btn-primary" onclick="AssistantPanel.sendFromInput()" title="发送"><i class="ph ph-paper-plane-tilt"></i></button>
  </div>
</div>

<button id="assistantFab" class="assistant-fab" onclick="AssistantPanel.toggle()" title="小助手">
  <i class="ph ph-chat-circle-text" style="font-size: 1.3rem;"></i> <span>小助手</span>
</button>
