{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{% endblock %} · 学习工具</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=361">
  <link rel="stylesheet" href="{% static 'css/portal.css' %}?v=2">
  <link rel="stylesheet" href="{% static 'vendor/phosphor/regular/style.css' %}?v=211">
  {% include 'partials/browser_storage.html' %}
  <script>
    try {
      var portalTheme = window.vocabLocalStorage.getItem('vocab-theme');
      if (['light', 'dark', 'blue', 'pureblue', 'sepia', 'nightblue'].includes(portalTheme)) {
        document.documentElement.dataset.theme = portalTheme;
      }
    } catch (error) {}
  </script>
  <script defer src="{% static 'js/app.js' %}?v=337"></script>
  <script defer src="{% static 'js/portal.js' %}?v=1"></script>
</head>
<body class="portal-page {% block portal_class %}{% endblock %}">
  <header class="portal-top">
    <div class="portal-width portal-top-inner">
      <a class="portal-brand" href="{% url 'words:dashboard' %}">
        <span class="portal-brand-mark"><i class="ph ph-book-open-text" aria-hidden="true"></i></span>
        <span>学习工具</span>
      </a>
      {% block portal_nav %}{% endblock %}
    </div>
  </header>
  <main class="portal-width portal-main" id="portal-main">
    {% for message in messages %}<p class="portal-notice portal-notice--success" role="status">{{ message }}</p>{% endfor %}
    {% block portal %}{% endblock %}
  </main>
  {% include 'partials/site_record.html' %}
</body>
</html>
