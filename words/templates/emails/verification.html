<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习工具｜邮箱注册验证码</title>
</head>
<body style="margin:0;padding:0;background:#f5f3ef;color:#211e1c;font-family:system-ui,'Microsoft YaHei',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f3ef;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#fff;border:1px solid #e8e1da;border-radius:12px;">
        <tr><td style="padding:28px;">
          <p style="margin:0 0 18px;color:#8f332a;font-size:14px;font-weight:700;">学习工具</p>
          <h1 style="margin:0 0 12px;font-size:24px;line-height:1.4;">邮箱注册验证码</h1>
          <p style="margin:0 0 20px;font-size:16px;line-height:1.65;">请在 <strong>{{ expires_minutes }} 分钟内</strong>返回注册页面，输入下面的验证码。</p>
          <p dir="ltr" style="margin:0 0 22px;padding:16px 12px;border-radius:8px;background:#faeeeb;color:#752c24;text-align:center;font-family:'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:0.14em;">{{ code }}</p>
          <p style="margin:0;border-top:1px solid #eee8e1;padding-top:16px;color:#615a54;font-size:14px;line-height:1.6;">如果你没有申请注册，可以忽略此邮件。</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
